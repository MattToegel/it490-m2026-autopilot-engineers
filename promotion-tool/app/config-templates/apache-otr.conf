# apache-otr.conf  (App role Apache virtual host)  -  ns87 (Noaman Shahid), Person B
# ----------------------------------------------------------------------------
# App-role configuration file (no secrets). Serves the OnTheRadar app from the
# App VM's web root. Same in every lane; only the .env values differ per lane.

<VirtualHost *:80>
    ServerName ontheradar.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/otr_error.log
    CustomLog ${APACHE_LOG_DIR}/otr_access.log combined
</VirtualHost>
